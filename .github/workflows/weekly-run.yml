name: Weekly NYT Romance Design Research

on:
  schedule:
    # Every Monday at 9:00 AM ET (13:00 UTC)
    - cron: '0 13 * * 1'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI

env:
  NYT_API_KEY: ${{ secrets.NYT_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  GOOGLE_SHEETS_CREDENTIALS_FILE: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS_FILE }}
  GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
  DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run the pipeline
        run: |
          cd backend
          python -c "
          from database import init_db, SessionLocal, BotRun
          from pipeline.orchestrator import run_full_pipeline

          # Initialize the database
          init_db()

          # Create a new run record
          db = SessionLocal()
          run = BotRun(status='running', current_stage=0, stage_label='Starting...')
          db.add(run)
          db.commit()
          run_id = run.id
          db.close()

          # Execute the pipeline
          run_full_pipeline(run_id)
          "

      - name: Upload database artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyt-bot-db-${{ github.run_number }}
          path: backend/nyt_bot.db
          retention-days: 90

      - name: Check run status
        run: |
          cd backend
          python -c "
          from database import SessionLocal, BotRun
          db = SessionLocal()
          run = db.query(BotRun).order_by(BotRun.id.desc()).first()
          if run:
              print(f'Run #{run.id}: {run.status}')
              print(f'Books processed: {run.books_processed}')
              print(f'Stage: {run.stage_label}')
              if run.status == 'failed':
                  print(f'Error: {run.error_log}')
                  exit(1)
          else:
              print('No run found')
              exit(1)
          db.close()
          "
